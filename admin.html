<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>作品编辑 | 再野文化工作室</title>
    <link rel="icon" href="favicon.png" type="image/png" sizes="192x192" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="admin.css?v=20260809a" />
    <link rel="stylesheet" href="theme.css" />
    <script src="admin.js?v=20260808d" defer></script>
  </head>
  <body>
    <header class="admin-header">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/site-logo.png" alt="" width="38" height="38" />
        <span class="brand-copy">
          <span>再野文化工作室</span>
          <small>LOCAL EDITOR</small>
        </span>
      </a>
      <div class="header-actions">
        <span class="status-pill" id="connectionStatus">正在连接本地服务</span>
        <button id="loadDefault" type="button">恢复静态数据</button>
        <button id="importJson" type="button">导入备份</button>
        <button id="exportJson" type="button">导出备份</button>
        <button id="saveDraft" type="button">保存草稿</button>
        <button id="publishDraft" class="primary" type="button">发布到官网文件</button>
        <input id="jsonFile" type="file" accept="application/json,.json" hidden />
        <a href="gallery.html" target="_blank" rel="noreferrer">查看正式页</a>
      </div>
    </header>

    <main data-editor>
      <section class="visual-editor-shell">
        <section class="visual-stage" aria-label="作品网页实时预览">
          <div class="visual-stage-bar">
            <div class="mode-tabs" role="tablist" aria-label="预览内容">
              <button class="is-active" type="button" data-mode="items">美术资料</button>
              <button type="button" data-mode="projects">项目入口</button>
            </div>
            <span>直接点击文字编辑 · 拖动卡片或图片调整顺序 · 点击图片后可替换</span>
            <div class="viewport-buttons" aria-label="预览宽度">
              <button class="is-active" type="button" data-viewport="desktop">电脑</button>
              <button type="button" data-viewport="mobile">手机</button>
            </div>
          </div>
          <div class="visual-frame-shell" data-viewport-shell>
            <iframe id="visualFrame" title="与正式作品页一致的编辑预览"></iframe>
          </div>
          <p class="visual-hint" id="visualHint">载入真实作品页面后，点击任意作品文字或图片开始编辑。</p>
        </section>

        <aside class="inspector-panel">
          <section class="inspector-section selection-toolbar">
            <p class="eyebrow">当前选择</p>
            <strong id="selectionLabel">尚未选择网页内容</strong>
            <div class="style-controls" data-style-controls hidden>
              <label>
                字号
                <input id="styleFontSize" type="number" min="8" max="72" step="1" />
              </label>
              <label>
                颜色
                <input id="styleColor" type="color" value="#252724" />
              </label>
              <label>
                字重
                <select id="styleWeight">
                  <option value="400">常规</option>
                  <option value="500">中等</option>
                  <option value="600">半粗</option>
                  <option value="700">粗体</option>
                  <option value="800">特粗</option>
                </select>
              </label>
              <button id="resetStyle" type="button">恢复网页默认</button>
            </div>
          </section>

          <section class="inspector-section list-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow" id="listEyebrow">图片条目</p>
              <strong id="itemCount">0 项</strong>
            </div>
            <button id="addEntry" type="button">新增</button>
          </div>
          <input id="searchItems" type="search" placeholder="搜索标题、项目或文件" />
            <div id="itemList" class="item-list"></div>
          </section>

          <section class="edit-panel inspector-section">

          <div class="editor-grid" data-item-editor>
            <section class="form-card">
              <p class="eyebrow">当前美术资料</p>
              <label>
                作品名
                <input id="captionName" placeholder="作品名" />
              </label>
              <label>
                右侧说明
                <textarea id="captionDescription" rows="3" placeholder="作品说明"></textarea>
              </label>
              <label class="legacy-field">
                原始归档文字
                <textarea id="title" rows="2" placeholder="用于旧资料分组和搜索"></textarea>
              </label>
              <div class="two">
                <label>
                  原简历页码
                  <input id="slide" type="number" min="0" step="1" />
                </label>
                <label>
                  所属新项目
                  <select id="projectId"></select>
                </label>
              </div>
              <label>
                图片地址
                <input id="file" readonly />
              </label>
              <div class="upload-row">
                <input id="itemImageFile" type="file" accept="image/jpeg,image/png,image/webp" />
                <button id="uploadItemImage" type="button">上传并替换图片</button>
              </div>
              <p class="upload-help">自动生成缩略图和展示图，并把小号斜向“再野文化”文字直接烘焙进图片。</p>
              <label>
                补充说明
                <textarea id="note" rows="3"></textarea>
              </label>
              <div class="actions">
                <button id="moveEntryUp" type="button">前移</button>
                <button id="moveEntryDown" type="button">后移</button>
                <button id="duplicateItem" type="button">复制条目</button>
                <button id="deleteItem" class="danger" type="button">删除条目</button>
              </div>
            </section>

            <section class="form-card">
              <p class="eyebrow">资料分类</p>
              <div class="check-group" data-checks="projects"><strong>项目类型</strong></div>
              <div class="check-group" data-checks="types"><strong>美术资料</strong></div>
            </section>

            <section class="preview-card compact-preview">
              <p class="eyebrow">图片预览</p>
              <div class="preview-frame">
                <img id="preview" alt="" />
                <span id="previewEmpty">没有图片预览</span>
              </div>
              <p class="form-status" id="uploadStatus" role="status"></p>
            </section>
          </div>

          <div class="editor-grid" data-project-editor hidden>
            <section class="form-card">
              <p class="eyebrow">当前项目</p>
              <div class="two">
                <label>
                  项目 ID
                  <input id="caseId" placeholder="英文或拼音，如 new-project" />
                </label>
                <label>
                  项目类型
                  <select id="caseType"></select>
                </label>
              </div>
              <label>
                项目名称
                <input id="caseTitle" placeholder="项目名称" />
              </label>
              <label>
                分类标签
                <input id="caseMeta" placeholder="电影 / 网大" />
              </label>
              <label>
                项目介绍
                <textarea id="caseCopy" rows="3"></textarea>
              </label>
              <label class="inline-check">
                <input id="caseVisible" type="checkbox" checked />
                在项目入口中显示
              </label>
              <div class="upload-row">
                <input id="projectImageFile" type="file" accept="image/jpeg,image/png,image/webp" />
                <button id="uploadProjectImage" type="button">上传项目封面</button>
              </div>
              <div class="actions">
                <button id="moveProjectUp" type="button">前移</button>
                <button id="moveProjectDown" type="button">后移</button>
                <button id="deleteProject" class="danger" type="button">删除项目</button>
              </div>
            </section>

            <section class="preview-card compact-preview">
              <p class="eyebrow">项目封面</p>
              <div class="preview-frame">
                <img id="projectPreview" alt="" />
                <span id="projectPreviewEmpty">尚未上传封面</span>
              </div>
              <p class="form-status" id="projectUploadStatus" role="status"></p>
            </section>
          </div>
          </section>
        </aside>
      </section>
      <div class="notice bottom-notice">
        <strong id="draftState">尚未读取草稿</strong>
        <span>仅供本机 Codex 使用。保存只写入 `.private` 草稿；点击“发布到官网文件”后才更新仓库里的静态作品数据。</span>
      </div>
    </main>

    <template id="rowTemplate">
      <button class="item-row" type="button">
        <img alt="" />
        <span><strong></strong><small></small></span>
      </button>
    </template>
  </body>
</html>
