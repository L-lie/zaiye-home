  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="#/home" aria-label="语藏首页">
        <img class="brand-mark" src="assets/prompt-vault-logo.png" alt="" width="38" height="38" />
        <span><strong>语藏</strong><small>Prompt Library</small></span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a href="#/home" data-nav="home">首页</a>
        <a href="#/discover" data-nav="discover">提示词库</a>
        <a href="#/publish/new" data-creator-link hidden>新建作品</a>

      <div class="header-actions">
        <a class="header-product-link" href="../prompt-vault.html" data-prompt-vault-link>安装 Prompt Vault</a>

          <a class="button ghost" href="#/login">登录</a>
        </div>
      </div>

      <section class="loading-state" aria-live="polite">

      </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <template id="errorTemplate">
      <section class="state-card error-card">
        <p class="eyebrow">暂时无法完成</p>
        <h1 data-error-title>发生错误</h1>
        <p data-error-message></p>
        <a class="button primary" href="#/discover">返回发现</a>
      </section>
